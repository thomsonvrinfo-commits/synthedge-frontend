name = "synthedge-entities"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "synthedge-db"
database_id = "2a1a6ca1-9fa4-4fe0-84a8-ad3f7822b3ef"
migrations_dir = "../../db/migrations"

[[kv_namespaces]]
binding = "KV"
id = "9ac4b377eea944d78e4c789f6412961f"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "synthedge-uploads"

[triggers]
crons = ["0 * * * *"]

[vars]
APP_BASE_URL = "https://synthedgeapp.co.zw"

[env.staging]
name = "synthedge-entities-staging"

[env.staging.triggers]
crons = ["0 * * * *"]

[env.staging.vars]
APP_BASE_URL = "https://synthedgeapp.co.zw"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "synthedge-db-staging"
database_id = "REPLACE_WITH_STAGING_DB_ID"
migrations_dir = "../../db/migrations"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "synthedge-uploads-staging"

[env.production]
name = "synthedge-entities-production"

[env.production.vars]
APP_BASE_URL = "https://synthedgeapp.co.zw"

[[env.production.d1_databases]]
binding = "DB"
database_name = "synthedge-db-production"
database_id = "REPLACE_WITH_PRODUCTION_DB_ID"
migrations_dir = "../../db/migrations"

[[env.production.kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_PRODUCTION_KV_ID"

[[env.production.r2_buckets]]
binding = "BUCKET"
bucket_name = "synthedge-uploads"

# Secrets are set through Wrangler CLI.
# wrangler secret put JWT_SECRET --env staging
# wrangler secret put JWT_SECRET --env production

# Broker sync:
# wrangler secret put BROKER_ENC_KEY --env staging
# wrangler secret put METAAPI_TOKEN --env staging
# Repeat for production.

# AI Trading Coach:
# wrangler secret put OPENAI_API_KEY --env staging
# wrangler secret put OPENAI_API_KEY --env production

# Optional:
# OPENAI_MODEL can be configured per environment.
# Default: gpt-4o-mini